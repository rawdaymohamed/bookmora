name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://booking:booking@localhost:5433/bookmora?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check linting
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Build application
        run: npm run build
